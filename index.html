<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>tercas.evernity</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >
</head>


<body>

    <!-- =================================
         MUSIC
    ================================== -->

    <audio
        id="music"
        src="mp3.mp3"
        loop
    ></audio>


    <!-- =================================
         HOME
    ================================== -->

    <section
        id="home"
        class="page home-page active"
    >

        <div class="background-overlay"></div>

        <div class="home-content">

            <p class="welcome">
                welcome to
            </p>

            <h1>
                tercas.evernity
            </h1>

            <p class="choose">
                choose where you want to go
            </p>


            <div class="menu-buttons">

                <button
                    class="menu-button"
                    onclick="openPage('instagram')"
                >
                    <span>♡</span>
                    Instagram
                </button>


                <button
                    class="menu-button"
                    onclick="openPage('gallery')"
                >
                    <span>✦</span>
                    Gallery
                </button>

            </div>

        </div>

    </section>



    <!-- =================================
         INSTAGRAM
    ================================== -->

    <section
        id="instagram"
        class="page instagram-page"
    >

        <div class="background-overlay"></div>


        <!-- BACK TO HOME -->

        <button
            class="back-button"
            onclick="openPage('home')"
        >
            ← <span>Back</span>
        </button>


        <div class="instagram-content">


            <!-- LATIN TITLE -->

            <div class="latin-title">
                tercas.evernity
            </div>


            <!-- PROFILE -->

            <img
                src="profil.png"
                class="profile"
                alt="Profile"
            >


            <!-- USERNAME -->

            <div class="username">
                @tercas.evernity
            </div>


            <!-- BARCODE -->

            <div class="barcode-box">

                <img
                    src="barcode.png"
                    class="barcode"
                    alt="Instagram Barcode"
                >

            </div>


            <p class="scan-text">
                scan me ♡
            </p>


            <!-- INSTAGRAM BUTTON -->

            <a
                href="https://instagram.com/tercas.evernity"
                target="_blank"
                class="instagram-button"
            >
                Open Instagram
            </a>

        </div>

    </section>



    <!-- =================================
         GALLERY
    ================================== -->

    <section
        id="gallery"
        class="page gallery-page"
    >

        <div class="gallery-overlay"></div>


        <!-- BACK TO HOME -->

        <button
            class="back-button"
            onclick="openPage('home')"
        >
            ← <span>Back</span>
        </button>


        <!-- GALLERY TITLE -->

        <div class="gallery-header">

            <p>
                little pieces of
            </p>

            <h1>
                memories
            </h1>

            <span>
                ♡ tercas.evernity ♡
            </span>

        </div>


        <!-- PHOTOS WILL APPEAR HERE -->

        <div
            id="photo-container"
            class="photo-container"
        ></div>

    </section>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
