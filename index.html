<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>tercas.evernity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <section id="home" class="page active">

    <div class="overlay"></div>

    <div class="home-content">

      <p class="welcome">
        WELCOME TO
      </p>

      <h1>
        tercas.evernity
      </h1>

      <p class="subtitle">
        a little place filled with memories
      </p>

      <div class="buttons">

        <button onclick="showPage('instagram')">
          Instagram
        </button>

        <button onclick="showPage('gallery')">
          Gallery
        </button>

      </div>

    </div>

  </section>


  <!-- INSTAGRAM -->
  <section id="instagram" class="page">

    <div class="overlay"></div>

    <button
      class="back-button"
      onclick="showPage('home')"
    >
      ← Back
    </button>

    <div class="instagram-content">

      <div class="profile-card">

        <img
          src="profil.png"
          class="profile"
          alt="Profile"
        >

        <h2>
          tercas.evernity
        </h2>

        <p>
          @tercas.evernity
        </p>

        <img
          src="barcode.png"
          class="barcode"
          alt="Instagram Barcode"
        >

        <a
          href="https://instagram.com/tercas.evernity"
          target="_blank"
          class="instagram-button"
        >
          Open Instagram
        </a>

      </div>

    </div>

  </section>


  <!-- GALLERY -->
  <section id="gallery" class="page">

    <div class="overlay"></div>

    <button
      class="back-button"
      onclick="showPage('home')"
    >
      ← Back
    </button>

    <div class="gallery-container">

      <div class="gallery-title">

        <p>
          OUR LITTLE MEMORIES
        </p>

        <h2>
          Gallery
        </h2>

      </div>

      <div id="galleryLoading">
        Loading memories...
      </div>

      <div id="galleryGrid"></div>

    </div>

  </section>


  <!-- MUSIC -->
  <audio
    id="music"
    loop
    preload="auto"
  >
    <source src="mp3.mp3" type="audio/mpeg">
  </audio>


  <!-- PHOTO VIEWER -->
  <div id="photoViewer">

    <button
      id="viewerClose"
      onclick="closeViewer()"
    >
      ×
    </button>

    <div id="viewerCounter"></div>

    <button
      id="viewerPrev"
      class="viewer-button"
      onclick="showPreviousPhoto()"
    >
      ‹
    </button>

    <img
      id="viewerImage"
      src=""
      alt="Photo"
    >

    <button
      id="viewerNext"
      class="viewer-button"
      onclick="showNextPhoto()"
    >
      ›
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
